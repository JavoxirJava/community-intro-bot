name: community-intro-bot

# 2026-08-11: 'postgres' servisi olib tashlandi — baza hostdagi PostgreSQL 18 ga
# ko'chirildi. Egalik 'postgres' superuser'idan alohida 'community_bot' roliga
# o'tkazildi (app endi superuser bilan ulanmaydi).
# Ulanish satri .env dagi DATABASE_URL dan olinadi — yagona manba.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_OWNER_IDS: ${BOT_OWNER_IDS:-}
      DATABASE_URL: ${DATABASE_URL:?.env faylida DATABASE_URL bo'lishi shart}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tashkent}
      TZ: Asia/Tashkent
